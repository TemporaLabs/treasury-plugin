# No npm entry, and adding one would watch nothing. package.json declares no
# dependencies, but that is true of the manifest rather than of what ships:
# dist/mcp-server.mjs embeds viem, zod and the MCP SDK, inlined at build time in
# the product repo, and Dependabot cannot see inside a committed bundle. The
# planned move to an exact-version npx pin (TemporaLabs/treasury-plugin#7) does
# not change that either — an npx argument is not a manifest.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
